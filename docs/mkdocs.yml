site_name: Dictum Language
site_description: "Natural language programming for systems code"
site_url: https://dictum-lang.github.io
repo_url: https://github.com/yourname/dictum
repo_name: dictum

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            docstring_style: google

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Your First Program: getting-started/first-program.md
    - Vibecoding Guide: getting-started/vibecoding.md
  - Language Guide:
    - Syntax Overview: language/syntax.md
    - Types: language/types.md
    - Memory Management: language/memory.md
    - Error Handling: language/errors.md
    - Classes (C++): language/classes.md
    - Templates: language/templates.md
    - Grammar Constraints: language/grammar.md
  - Standard Library:
    - Core: stdlib/core.md
    - AI/ML: stdlib/ai-ml.md
    - IoT/Embedded: stdlib/iot.md
    - Robotics: stdlib/robotics.md
  - Tooling:
    - VS Code Extension: tooling/vscode.md
    - REPL: tooling/repl.md
    - LSP Server: tooling/lsp.md
    - CLI Reference: tooling/cli.md
  - Advanced:
    - Target Platforms: advanced/targets.md
    - Performance: advanced/performance.md
    - Contributing: advanced/contributing.md
  - API Reference: api.md
